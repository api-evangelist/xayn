name: Xayn (now Noxtua)
description: Xayn is a Berlin-based AI company founded in 2017 as XAIN out of research
  by Dr. Leif-Nissen Lundbaek and Prof. Michael Huth at Oxford and Imperial College
  London. Rebranded to Xayn in 2020, it built the Xaynet privacy-preserving federated
  learning framework and a privacy-protecting search and discovery engine. In February
  2024 the company pivoted to legal AI and rebranded as Noxtua AG (noxtua.com), Europe's
  sovereign Legal AI for research, document analysis, and drafting, backed by a Series
  A of EUR 10M (2021, Global Brain/KDDI, with Earlybird) and a Series B of roughly
  EUR 81M led by legal publisher C.H. Beck. xayn.com is offline and the company publishes
  no public API or developer portal today; its former open-source SDKs and packages
  are archived.
